<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>youfeel</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1e1e2e;--surface:#181825;--surface2:#313244;--surface3:#45475a;--text:#cdd6f4;--text2:#a6adc8;--text3:#6c7086;--blue:#89b4fa;--green:#a6e3a1;--yellow:#f9e2af;--red:#f38ba8;--radius:12px;--radius-sm:8px}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;display:flex;flex-direction:column}
.sidebar{background:var(--surface);border-bottom:1px solid var(--surface3);padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex-shrink:0;z-index:10}
.sidebar .brand{font-size:18px;font-weight:700;color:var(--blue);margin-right:8px;white-space:nowrap}
.sidebar label{font-size:11px;color:var(--text2);display:none}
.sidebar select{padding:4px 8px;border-radius:var(--radius-sm);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:13px;outline:none;cursor:pointer;max-width:120px}
.sidebar .btn{padding:5px 12px;border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.sidebar .btn:hover{opacity:.8}
.toggle-controls{background:var(--surface2);color:var(--text);padding:5px 10px;border-radius:var(--radius-sm);border:none;font-size:11px;cursor:pointer;margin-left:auto;white-space:nowrap}
.controls-panel{display:none;width:100%;padding:8px 0 4px;gap:8px}
.controls-panel.open{display:flex;flex-direction:column}
.stat{font-size:11px;color:var(--text2);line-height:1.4}
.stat b{color:var(--text)}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.5;animation:fadeIn .2s;word-wrap:break-word}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.user{background:var(--blue);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.assistant{background:var(--surface2);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.msg .meta{font-size:10px;color:var(--text3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.msg.control{background:var(--surface3);color:var(--yellow);align-self:center;font-size:12px;max-width:60%}
.input-bar{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--surface3);flex-shrink:0}
.input-bar input{flex:1;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:15px;outline:none;min-width:0}
.input-bar input:focus{border-color:var(--blue)}
.input-bar .btn{padding:10px 18px;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.input-bar .btn:hover{opacity:.85}
.listening{color:var(--yellow);font-size:12px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(min-width:768px){
  body{flex-direction:row}
  .sidebar{width:280px;flex-direction:column;align-items:stretch;border-bottom:none;border-right:1px solid var(--surface3);padding:16px;overflow-y:auto;flex-shrink:0}
  .sidebar .brand{font-size:20px;margin-bottom:8px}
  .sidebar label{display:block;margin-top:8px}
  .sidebar select{max-width:100%;padding:6px 10px;font-size:13px}
  .sidebar .btn{padding:8px 16px;font-size:13px}
  .toggle-controls{display:none}
  .controls-panel{display:flex !important;flex-direction:column;gap:10px;padding:8px 0}
  .msgs{padding:16px 20px}
  .msg{max-width:75%;font-size:15px}
  .input-bar{padding:12px 20px}
  .input-bar input{font-size:14px}
}
@media(min-width:1024px){.sidebar{width:320px}.msg{max-width:70%}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <span class="brand">youfeel</span>
  <select id="persona"><option value="mentor">Mentor</option><option value="coach">Coach</option><option value="teacher">Teacher</option><option value="mentor:50+coach:30+teacher:20">Blended</option></select>
  <button class="btn" id="voiceBtn" style="background:var(--surface3);color:var(--text)">🎤 Voice</button>
  <span id="voiceStatus" class="stat" style="font-size:11px">Idle</span>
  <button class="toggle-controls" id="toggleCtrl">▼ Controls</button>
  <div class="controls-panel" id="controlsPanel">
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Weights</label><div id="weights"></div></div>
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Stats</label><div id="stats" class="stat">Loading...</div></div>
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Heatmap & Reinforce</label><div id="heatmap"></div><div style="display:flex;gap:4px;margin-top:4px"><button class="btn" id="narrateHeatBtn" style="background:var(--surface3);color:var(--text);font-size:10px">🔊 Narrate</button><button class="btn" id="reinforceBtn" style="background:var(--yellow);color:var(--bg);font-size:10px">⚡ Reinforce</button></div></div>
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Training Cycles</label><div id="trainingStats" class="stat">No training data</div><div id="trainingList" style="font-size:10px;color:var(--text3);max-height:60px;overflow-y:auto;margin:2px 0"></div><div style="display:flex;gap:4px;margin-top:2px"><button class="btn" id="trainNarrBtn" style="background:var(--surface3);color:var(--text);font-size:10px">🔊 Narrate Training</button><button class="btn" id="clearTrainBtn" style="background:var(--red);color:var(--bg);font-size:10px">✕ Clear</button></div></div>
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Simulation</label><div style="display:flex;gap:4px;margin:2px 0"><select id="simBlendSelect" style="flex:1;padding:3px 6px;border-radius:var(--radius-sm);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:10px;outline:none"><option value="all">All blends</option><option value="mentor:100+coach:0+teacher:0">Mentor only</option><option value="mentor:0+coach:100+teacher:0">Coach only</option><option value="mentor:0+coach:0+teacher:100">Teacher only</option><option value="mentor:34+coach:33+teacher:33">Balanced</option><option value="mentor:60+coach:20+teacher:20">Mentor-heavy</option></select><input id="simRounds" value="10" style="width:36px;padding:3px;border-radius:var(--radius-sm);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:10px;text-align:center;outline:none"><button class="btn" id="simBtn" style="background:var(--green);color:var(--bg);font-size:10px">▶ Run</button></div><div id="simResults" class="stat" style="font-size:10px">Ready</div></div>
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Identity</label><div style="display:flex;gap:4px"><input id="userIdInput" placeholder="Your name..." style="flex:1;padding:4px 8px;border-radius:var(--radius-sm);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:11px;outline:none;min-width:0"><button class="btn" id="setUserBtn" style="background:var(--blue);color:var(--bg);font-size:10px">Set</button></div><span id="userDisplay" class="stat" style="margin-top:2px;font-size:10px;color:var(--text3)">Not set</span></div>
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Contributors</label><div id="contributorList" class="stat">No contributors</div></div>
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Sync</label><div id="syncStatus" class="stat">Checking...</div><button class="btn" id="syncBtn" style="background:var(--surface3);color:var(--text);font-size:10px;margin-top:2px">🔄 Sync Now</button></div>
    <div><label style="display:block;margin-bottom:4px;font-size:11px">Conflict Stats</label><div id="conflictStats" class="stat">No data</div></div>
    <div id="alertBanner" style="display:none;background:var(--red);color:var(--bg);padding:6px 10px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;margin-top:4px"></div>
  </div>
</div>
<div class="main">
  <div class="msgs" id="msgs"></div>
  <div class="input-bar">
    <input id="input" placeholder="Type a message, or try 'set mentor 60 coach 25 teacher 15'..." autofocus>
    <button class="btn" id="sendBtn" style="background:var(--blue);color:var(--bg)">Send</button>
  </div>
</div>
<script>
const API='/api';let persona='mentor',weights={},conv=[],listening=0,R=null,alertShown={};
const $=s=>document.querySelector(s),i=$('#input'),m=$('#msgs'),s=$('#sendBtn'),p=$('#persona'),w=$('#weights'),st=$('#stats'),h=$('#heatmap'),vb=$('#voiceBtn'),vs=$('#voiceStatus'),tc=$('#toggleCtrl'),cp=$('#controlsPanel'),ns=$('#syncStatus'),nb=$('#syncBtn'),nh=$('#narrateHeatBtn'),ab=$('#alertBanner'),rb=$('#reinforceBtn'),cs=$('#conflictStats'),ts=$('#trainingStats'),tl=$('#trainingList'),tn=$('#trainNarrBtn'),ctb=$('#clearTrainBtn'),uid=$('#userIdInput'),sub=$('#setUserBtn'),ud=$('#userDisplay'),cl=$('#contributorList'),sb=$('#simBtn'),sr=$('#simResults'),ss=$('#simBlendSelect'),sri=$('#simRounds');
let userId=localStorage.getItem('youfeel_user')||'';

tc.onclick=()=>{cp.classList.toggle('open');tc.textContent=cp.classList.contains('open')?'▲ Controls':'▼ Controls'};

function headers(){
  const h={'Content-Type':'application/json'};
  if(userId)h['X-User-Id']=userId;
  return h
}

function updateUserDisplay(){
  if(userId){ud.innerHTML='<span style="color:var(--green)">\u25CF</span> '+userId;uid.value=userId}
  else ud.innerHTML='<span style="color:var(--red)">\u25CF</span> Not set'
}
function setUserId(name){
  userId=name;localStorage.setItem('youfeel_user',name);updateUserDisplay();
  addControl('Identity set to '+name);speakText('Hello, '+name)
}
sub.onclick=()=>{const n=uid.value.trim();if(n)setUserId(n)};
uid.onkeydown=e=>{if(e.key==='Enter')sub.click()};
if(userId)updateUserDisplay();

function add(r,t,meta){
  const d=document.createElement('div');d.className='msg '+r;
  d.innerHTML=t.replace(/\n/g,'<br>');
  if(meta){const m2=document.createElement('div');m2.className='meta';m2.textContent=meta;d.appendChild(m2)}
  m.appendChild(d);m.scrollTop=m.scrollHeight
}
function addControl(t){add('control','⚙️ '+t)}
function speakText(text){if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(text);u.rate=1.1;speechSynthesis.speak(u)}}

function parseWeightText(text){
  const parts=text.toLowerCase().split(/[,;]+/);
  const newW={};let found=0;
  for(const p of parts){
    const m=p.match(/\s*(mentor|coach|teacher)\s*[=:]\s*(\d+)/);
    if(m){newW[m[1]]=Math.min(100,Math.max(0,parseInt(m[2])));found++}
  }
  if(found>=2)return newW;
  const m2=text.toLowerCase().match(/(mentor|coach|teacher)\s+(\d+)/g);
  if(m2&&m2.length>=2){m2.forEach(p=>{const[,n,v]=p.match(/(mentor|coach|teacher)\s+(\d+)/);newW[n]=Math.min(100,Math.max(0,parseInt(v)))});return newW}
  return null
}

async function chat(msg){
  add('user',msg);i.disabled=1;s.disabled=1;
  try{
    const r2=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,persona:persona,weights:weights,conversation:conv})});
    const d=await r2.json();
    add('assistant',d.reply,`score: ${d.score}${d.intent?' \u2022 intent: '+d.intent:''}${d.escalation_tier?' \u2022 tier '+d.escalation_tier:''}`);
    weights=d.weights||weights;updateW();
    if(d.escalation_tier)cue(d.escalation_tier,d.intent)
  }catch(e){add('assistant','Error: '+e.message)}
  i.disabled=0;s.disabled=0;i.focus()
}

function updateW(){
  w.innerHTML='';const names=Object.keys(weights).length?Object.keys(weights):['mentor','coach','teacher'];
  const vals=Object.keys(weights).length?Object.values(weights):[50,0,0];
  const cs={mentor:'#89b4fa',coach:'#a6e3a1',teacher:'#f9e2af'};
  names.forEach((n,j)=>{
    const v=vals[j]||0,c=cs[n]||'#89b4fa';
    const r2=document.createElement('div');r2.style.cssText='display:flex;align-items:center;gap:6px;margin:2px 0';
    r2.innerHTML='<span style="font-size:11px;min-width:52px;color:var(--text2)">'+n+'</span><div class="wbar" style="height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;flex:1"><div style="height:100%;border-radius:3px;transition:width .3s;width:'+v+'%;background:'+c+'"></div></div><span style="font-size:10px;min-width:26px;color:var(--text2)">'+v+'</span>';
    w.appendChild(r2)
  })
}

async function refreshTraining(){
  try{
    const r=await fetch(API+'/training-history');const d=await r.json();
    ts.innerHTML='Weak: <b>'+d.weak_count+'</b> \u22c5 Reinforce: <b>'+d.reinforce_count+'</b> \u22c5 Total: <b>'+d.total_events+'</b>';
    tl.innerHTML=d.recent.slice(-5).reverse().map(e=>{
      const t=new Date(e.timestamp).toLocaleTimeString();
      if(e.type==='weak_reply') return '<span style="color:var(--red)">\u26A0</span> weak <b>'+e.score+'</b> ('+e.intent+') \u22c5 '+t;
      if(e.type==='reinforce') return '<span style="color:var(--yellow)">\u26A1</span> reinforce <b>'+e.intent+'</b> \u22c5 '+t;
      return ''
    }).join('<br>')
  }catch(e){ts.innerHTML='Offline'}
}

async function narrateTraining(){
  try{
    const r=await fetch(API+'/training-narration');const d=await r.json();
    addControl('Training: '+d.narration);
    speakText(d.narration)
  }catch(e){}
}

async function refreshContributors(){
  try{
    const r=await fetch(API+'/contributors');const d=await r.json();
    if(d.contributors.length){
      cl.innerHTML=d.contributors.map(c=>'<span style="color:'+(c.user_id===userId?'var(--blue)':'var(--text2)')+'">'+(c.last_sync?'\uD83D\uDFE2 ':'\uD83D\uDD34 ')+c.user_id+'</span> sync:'+c.sync_count+' conflict:'+c.conflict_count).join(' &middot; ')
    }
  }catch(e){cl.innerHTML='Offline'}
}

async function refreshStats(){
  try{
    const [r2,r3,r4,r5]=await Promise.all([
      fetch(API+'/dashboard'),
      fetch(API+'/sync-status'),
      fetch(API+'/weak-alert'),
      fetch(API+'/conflict-stats')
    ]);
    const d=await r2.json();st.innerHTML='Avg: <b>'+(d.avg_confidence||'N/A')+'</b> \u22c5 Recent: ['+d.recent_scores.slice(-5).join(',')+']';
    const ds=await r3.json();
    ns.innerHTML='<span style="color:'+(ds.last_sync==='synced'?'var(--green)':'var(--red)')+'">\u25CF</span> '+ds.last_sync+(ds.last_sync_time?' \u22c5 '+new Date(ds.last_sync_time).toLocaleTimeString():'');
    if(ds.contributors)refreshContributors();
    const da=await r4.json();
    if(da.alert&&!alertShown.weak){ab.style.display='block';ab.textContent=da.message;alertShown.weak=1;speakText('Alert: '+da.message);setTimeout(()=>{ab.style.display='none'},8000)};
    const dc=await r5.json();
    if(dc.total){cs.innerHTML='Total: <b>'+dc.total+'</b> \u22c5 auto: '+dc.auto+' \u22c5 gui: '+dc.gui+' \u22c5 voice: '+dc.voice+' \u22c5 manual: '+dc.manual+(dc.by_user?' \u22c5 <span style="color:var(--text3)">users: '+Object.keys(dc.by_user).join(', ')+'</span>':'')}
    await refreshTraining()
  }catch(e){st.textContent='Offline'}
}

async function updateHeatmap(){
  try{
    const intents=['motivate','explain','advise','general'];const tiers=[1,2,3];
    h.innerHTML='<div style="display:grid;grid-template-columns:70px repeat(3,1fr);gap:2px;font-size:10px"><div></div><div style="text-align:center;color:var(--text3)">T1</div><div style="text-align:center;color:var(--text3)">T2</div><div style="text-align:center;color:var(--text3)">T3</div>'+intents.map(i=>'<div style="color:var(--text2)">'+i+'</div>'+tiers.map(t=>'<div style="background:var(--surface3);padding:3px;text-align:center;border-radius:3px;color:var(--text3)">0</div>').join('')).join('')+'</div>'
  }catch(e){}
}

function cue(tier,intent){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    const fs=intent==='motivate'?[523,659,784]:intent==='explain'?[440,440,440]:intent==='advise'?[784,659,523]:[400,500,700];
    osc.frequency.setValueAtTime(fs[Math.min(tier-1,fs.length-1)],ctx.currentTime);
    gain.gain.setValueAtTime(0.25,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.2);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.2)
  }catch(e){}
}

p.onchange=()=>{persona=p.value};

s.onclick=()=>{
  const t=i.value.trim();
  if(!t)return;i.value='';
  const lower=t.toLowerCase();
  if(lower.startsWith('set ')||lower.startsWith('weights ')||lower.startsWith('weight ')){
    const parsed=parseWeightText(t);
    if(parsed){weights=parsed;updateW();addControl('Weights set: '+JSON.stringify(weights));speakText('Weights updated');return}
  }
  chat(t)
};
i.onkeydown=e=>{if(e.key==='Enter')s.click()};

tn.onclick=narrateTraining;
ctb.onclick=()=>{ts.innerHTML='Cleared';fetch(API+'/reset-training',{method:'POST'}).catch(()=>{})};

nb.onclick=async()=>{
  if(!userId){
    const n=prompt('Enter your name for sync identity:');
    if(n){setUserId(n.trim())}else{addControl('Set your identity first');return}
  }
  try{
    const r2=await fetch(API+'/sync',{method:'POST',headers:headers()});const d=await r2.json();
    ns.innerHTML='<span style="color:var(--green)">\u25CF</span> synced \u22c5 '+new Date(d.synced_at).toLocaleTimeString();
    const nar='Sync for '+d.user_id+': sync number '+d.sync_count+', '+d.total_scores+' responses logged, '+d.weak_count+' weak, average confidence '+d.avg_confidence+'.';
    speakText(nar);addControl('Sync for '+d.user_id+' \u2116'+d.sync_count+': '+d.total_scores+' responses, '+d.weak_count+' weak, avg '+d.avg_confidence);
    await narrateTraining();await refreshContributors()
  }catch(e){ns.innerHTML='<span style="color:var(--red)">\u25CF</span> sync failed'}
};

nh.onclick=async()=>{
  try{const r2=await fetch(API+'/heatmap-narration');const d=await r2.json();addControl('Narrated: '+d.narration);speakText(d.narration)}catch(e){}
};

rb.onclick=async()=>{
  try{const r2=await fetch(API+'/reinforce');const d=await r2.json();addControl(d.message);speakText(d.message)}catch(e){}
};

sb.onclick=async()=>{
  const rounds=parseInt(sri.value)||10;
  const blendVal=ss.value;
  const blends=blendVal==='all'?null:[{name:ss.options[ss.selectedIndex].text,persona:blendVal,weights:parseBlendWeights(blendVal)}];
  sr.innerHTML='Running simulation...';
  addControl('Simulation started: '+rounds+' rounds x '+(blends?1:5)+' blends');
  try{
    const r=await fetch(API+'/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rounds,blends})});
    const d=await r.json();
    let html='<div style="display:grid;grid-template-columns:auto 1fr 1fr 1fr 1fr;gap:2px 6px;font-size:10px">';
    html+='<b>Blend</b><b style="text-align:right">Avg</b><b style="text-align:right">Esc</b><b style="text-align:right">Weak%</b><b style="text-align:right">Intent</b>';
    d.results.forEach(res=>{
      html+='<span>'+res.name+'</span>';
      html+='<span style="text-align:right;color:'+(res.avg_confidence>=70?'var(--green)':res.avg_confidence>=50?'var(--yellow)':'var(--red)')+'">'+res.avg_confidence+'%</span>';
      html+='<span style="text-align:right">'+res.escalations+'</span>';
      html+='<span style="text-align:right;color:'+(parseFloat(res.weak_ratio)<20?'var(--green)':parseFloat(res.weak_ratio)<40?'var(--yellow)':'var(--red)')+'">'+res.weak_ratio+'</span>';
      html+='<span style="text-align:right;color:var(--text2)">'+res.best_intent+'</span>'
    });
    html+='</div>';
    sr.innerHTML=html;
    addControl('Simulation done: '+d.total_prompts+' prompts across '+(blends?1:5)+' blends')
  }catch(e){sr.innerHTML='Error: '+e.message}
};

function parseBlendWeights(val){
  const w={};val.split('+').forEach(p=>{const[m,n]=p.split(':');if(m&&n)w[m]=parseInt(n)});return w
}

vb.onclick=()=>{
  if(listening){R&&R.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){vs.textContent='Voice not supported';return}
  R=new SR();R.lang='en-US';R.interimResults=0;R.continuous=0;
  R.onstart=()=>{listening=1;vb.textContent='\u23F9 Stop';vb.style.background='var(--red)';vs.textContent='Listening...';vs.className='listening'};
  R.onend=()=>{listening=0;vb.textContent='\uD83C\uDFA4 Voice';vb.style.background='var(--surface3)';vs.textContent='Idle';vs.className='stat'};
  R.onresult=e=>{
    const t=e.results[0][0].transcript;
    const parsed=parseWeightText(t);
    if(parsed){weights=parsed;updateW();vs.textContent='Weights: '+JSON.stringify(weights);speakText('Weights updated');addControl('Voice weights: '+JSON.stringify(weights))}
    else{vs.textContent='Heard: '+t;chat(t)}
  };
  R.onerror=e=>{vs.textContent='Error: '+e.error;listening=0;vb.textContent='\uD83C\uDFA4 Voice';vb.style.background='var(--surface3)'};
  R.start()
};

refreshStats();updateW();updateHeatmap();setInterval(refreshStats,10000);setInterval(updateHeatmap,15000);
add('assistant','Hey, I\u2019m youfeel. What\u2019s on your mind?<br><span style="font-size:11px;color:var(--text3)">Tip: type <b>set mentor 60 coach 25 teacher 15</b> to adjust weights, or click <b>Narrate Training</b> for a spoken training summary.</span>')
</script>
</body>
