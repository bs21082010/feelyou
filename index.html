<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>feelYou</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#1e1e2e;color:#cdd6f4;height:100vh;display:flex}
.sidebar{width:280px;background:#181825;padding:16px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #313244}
.sidebar h2{font-size:16px;color:#89b4fa;margin-bottom:4px}
.sidebar label{font-size:12px;color:#a6adc8}
.sidebar select,.sidebar input[type=range]{width:100%;padding:6px;border-radius:6px;border:1px solid #45475a;background:#313244;color:#cdd6f4;font-size:13px}
.sidebar input[type=range]{padding:0;height:6px;accent-color:#89b4fa}
.weight-row{display:flex;align-items:center;gap:8px}
.weight-row span{font-size:12px;min-width:60px}
.weight-bar{flex:1;height:10px;background:#313244;border-radius:5px;overflow:hidden}
.weight-fill{height:100%;border-radius:5px;transition:width .3s}
.stat{font-size:12px;color:#a6adc8;padding:2px 0}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.85}
.main{flex:1;display:flex;flex-direction:column}
.header{padding:16px 20px;border-bottom:1px solid #313244;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;color:#89b4fa}
.msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.user{background:#89b4fa;color:#1e1e2e;align-self:flex-end;border-bottom-right-radius:4px}
.assistant{background:#313244;color:#cdd6f4;align-self:flex-start;border-bottom-left-radius:4px}
.msg .meta{font-size:11px;color:#6c7086;margin-top:4px;display:flex;gap:8px}
.input-bar{display:flex;gap:8px;padding:12px 20px;border-top:1px solid #313244;background:#181825}
.input-bar input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid #45475a;background:#313244;color:#cdd6f4;font-size:14px;outline:none}
.input-bar input:focus{border-color:#89b4fa}
.listening{color:#f9e2af;font-size:12px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#heatmap{display:grid;gap:2px;margin-top:4px}
.heat-cell{padding:4px;text-align:center;font-size:11px;border-radius:4px}
</style>
</head>
<body>
<div class="sidebar">
  <h2>feelYou</h2>
  <label>Persona</label>
  <select id="persona"><option value="mentor">Mentor</option><option value="coach">Coach</option><option value="teacher">Teacher</option><option value="mentor:50+coach:30+teacher:20">Blended</option></select>
  <label>Voice</label>
  <button class="btn" id="voiceBtn" style="background:#45475a;color:#cdd6f4">Start Voice</button>
  <div id="voiceStatus" class="stat">Idle</div>
  <hr style="border-color:#313244">
  <label>Weights</label>
  <div id="weights"></div>
  <hr style="border-color:#313244">
  <label>Stats</label>
  <div id="stats" class="stat">Loading...</div>
  <hr style="border-color:#313244">
  <label>Heatmap</label>
  <div id="heatmap"></div>
</div>
<div class="main">
  <div class="header"><h1>feelYou</h1><span id="modelBadge" style="font-size:12px;color:#6c7086">llama3.2</span></div>
  <div class="msgs" id="msgs"></div>
  <div class="input-bar">
    <input id="input" placeholder="Type a message..." autofocus>
    <button class="btn" id="sendBtn" style="background:#89b4fa;color:#1e1e2e">Send</button>
  </div>
</div>
<script>
const API = '/api';
let persona = 'mentor', weights = {}, conv = [], listening = false, recognition = null, voiceBtn = document.getElementById('voiceBtn'), voiceStatus = document.getElementById('voiceStatus'), input = document.getElementById('input'), msgs = document.getElementById('msgs'), sendBtn = document.getElementById('sendBtn'), personaSel = document.getElementById('persona'), weightsEl = document.getElementById('weights'), statsEl = document.getElementById('stats'), heatmapEl = document.getElementById('heatmap'), modelBadge = document.getElementById('modelBadge');

function addMsg(role, text, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = text.replace(/\n/g, '<br>');
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
}

async function chat(msg) {
  addMsg('user', msg);
  input.disabled = true; sendBtn.disabled = true;
  try {
    const res = await fetch(API + '/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg,persona:persona,weights:weights,conversation:conv}) });
    const data = await res.json();
    addMsg('assistant', data.reply, score: );
    weights = data.weights || weights;
    updateWeights();
    if (data.escalation_tier) playCue(data.escalation_tier, data.intent);
  } catch(e) { addMsg('assistant', 'Error: ' + e.message); }
  input.disabled = false; sendBtn.disabled = false; input.focus();
}

function updateWeights() {
  weightsEl.innerHTML = '';
  const names = Object.keys(weights).length ? Object.keys(weights) : ['mentor','coach','teacher'];
  const vals = Object.keys(weights).length ? Object.values(weights) : [50,0,0];
  names.forEach((n,i) => {
    const v = vals[i] || 0;
    const colors = {mentor:'#89b4fa',coach:'#a6e3a1',teacher:'#f9e2af'};
    const c = colors[n] || '#89b4fa';
    const row = document.createElement('div'); row.className = 'weight-row';
    row.innerHTML = '<span>'+n+'</span><div class="weight-bar"><div class="weight-fill" style="width:'+v+'%;background:'+c+'"></div></div><span style="font-size:11px;min-width:30px">'+v+'</span>';
    weightsEl.appendChild(row);
  });
}

async function refreshStats() {
  try {
    const res = await fetch(API + '/dashboard');
    const d = await res.json();
    statsEl.innerHTML = 'Avg confidence: ' + (d.avg_confidence || 'N/A') + '<br>Scores: [' + d.recent_scores.slice(-5).join(',') + ']';
  } catch(e) { statsEl.textContent = 'Offline'; }
}

function playCue(tier, intent) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const freqs = intent === 'motivate' ? [523,659,784] : intent === 'explain' ? [440,440,440] : intent === 'advise' ? [784,659,523] : [400,500,700];
    osc.frequency.setValueAtTime(freqs[Math.min(tier-1,freqs.length-1)], ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}

personaSel.addEventListener('change', () => { persona = personaSel.value; });
sendBtn.addEventListener('click', () => { const m = input.value.trim(); if(m) { input.value = ''; chat(m); } });
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendBtn.click(); });

document.getElementById('voiceBtn').addEventListener('click', () => {
  if (listening) { if(recognition) recognition.stop(); return; }
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { voiceStatus.textContent = 'Voice not supported'; return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR(); recognition.lang = 'en-US'; recognition.interimResults = false; recognition.continuous = false;
  recognition.onstart = () => { listening = true; voiceBtn.textContent = 'Stop Voice'; voiceBtn.style.background = '#f38ba8'; voiceStatus.textContent = 'Listening...'; voiceStatus.className = 'stat listening'; };
  recognition.onend = () => { listening = false; voiceBtn.textContent = 'Start Voice'; voiceBtn.style.background = '#45475a'; voiceStatus.textContent = 'Idle'; voiceStatus.className = 'stat'; };
  recognition.onresult = (e) => { const text = e.results[0][0].transcript; voiceStatus.textContent = 'Heard: ' + text; chat(text); };
  recognition.onerror = (e) => { voiceStatus.textContent = 'Error: ' + e.error; listening = false; voiceBtn.textContent = 'Start Voice'; voiceBtn.style.background = '#45475a'; };
  recognition.start();
});

refreshStats(); updateWeights(); setInterval(refreshStats, 10000);
addMsg('assistant', 'Hello! I\'m feelYou. How can I help you today?');
</script>
</body>
</html>
