<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>youfeel</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1e1e2e;--surface:#181825;--surface2:#313244;--surface3:#45475a;--text:#cdd6f4;--text2:#a6adc8;--text3:#6c7086;--blue:#89b4fa;--green:#a6e3a1;--yellow:#f9e2af;--red:#f38ba8;--radius:12px;--radius-sm:8px}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;display:flex;flex-direction:column}
.sidebar{background:var(--surface);border-bottom:1px solid var(--surface3);padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;flex-shrink:0;z-index:10}
.sidebar .brand{font-size:16px;font-weight:700;color:var(--blue);margin-right:6px;white-space:nowrap}
.sidebar select{padding:3px 6px;border-radius:var(--radius-sm);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:12px;outline:none;cursor:pointer;max-width:100px}
.sidebar .btn{padding:4px 8px;border:none;border-radius:var(--radius-sm);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.sidebar .btn:hover{opacity:.8}
.nav-tabs{display:flex;gap:2px;width:100%;margin:4px 0 2px}
.nav-tabs .tab-btn{padding:3px 8px;border:none;border-radius:var(--radius-sm);font-size:10px;cursor:pointer;background:var(--surface2);color:var(--text3);transition:all .2s;flex:1;text-align:center}
.nav-tabs .tab-btn.active{background:var(--blue);color:var(--bg);font-weight:600}
.nav-tabs .tab-btn:hover{opacity:.8}
.mini-metrics{display:flex;gap:8px;width:100%;font-size:9px;color:var(--text3);padding:2px 0}
.mini-metrics span{white-space:nowrap}
.stat{font-size:11px;color:var(--text2);line-height:1.4}
.stat b{color:var(--text)}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.tab-content{display:none;flex:1;flex-direction:column;min-height:0}
.tab-content.active{display:flex}
.msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.5;animation:fadeIn .2s;word-wrap:break-word}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes barPulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
@keyframes avatarPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(137,180,250,.5)}50%{transform:scale(1.25);box-shadow:0 0 8px 2px rgba(137,180,250,.4)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(137,180,250,0)}}
.p-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--bg);transition:transform .3s,box-shadow .3s;cursor:default}
.p-avatar.boosted{animation:avatarPulse .6s ease-in-out 2}
.user{background:var(--blue);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.assistant{background:var(--surface2);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.msg .meta{font-size:10px;color:var(--text3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.msg.control{background:var(--surface3);color:var(--yellow);align-self:center;font-size:12px;max-width:60%}
.input-bar{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--surface3);flex-shrink:0}
.input-bar input{flex:1;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:15px;outline:none;min-width:0}
.input-bar input:focus{border-color:var(--blue)}
.input-bar .btn{padding:10px 18px;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.input-bar .btn:hover{opacity:.85}
.listening{color:var(--yellow);font-size:12px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.llm-banner{width:100%;padding:3px 8px;border-radius:var(--radius-sm);font-size:9px;text-align:center;margin:2px 0}
.llm-banner.online{background:var(--green);color:var(--bg)}
.llm-banner.offline{background:var(--yellow);color:var(--bg)}
.llm-banner.mock{background:var(--surface3);color:var(--text3)}
.panel-scroll{flex:1;overflow-y:auto;padding:10px 12px}
.panel-scroll .stat{font-size:10px}
@media(min-width:768px){
  body{flex-direction:row}
  .sidebar{width:200px;flex-direction:column;align-items:stretch;border-bottom:none;border-right:1px solid var(--surface3);padding:12px;overflow-y:auto;flex-shrink:0}
  .sidebar .brand{font-size:18px;margin-bottom:4px}
  .sidebar select{max-width:100%;padding:4px 8px;font-size:12px}
  .sidebar .btn{padding:6px 12px;font-size:12px}
  .nav-tabs .tab-btn{font-size:11px;padding:4px 10px}
  .msgs{padding:16px 20px}
  .msg{max-width:75%;font-size:15px}
  .input-bar{padding:12px 20px}
  .input-bar input{font-size:14px}
}
@media(min-width:1024px){.sidebar{width:220px}.msg{max-width:70%}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div style="display:flex;align-items:center;gap:4px;width:100%">
    <span class="brand">youfeel</span>
    <select id="persona"><option value="mentor">Mentor</option><option value="coach">Coach</option><option value="teacher">Teacher</option><option value="mentor:50+coach:30+teacher:20">Blended</option></select>
    <button class="btn" id="voiceBtn" style="background:var(--surface3);color:var(--text);margin-left:auto">🎤</button>
  </div>
  <div id="weights" style="width:100%;margin:2px 0"></div>
  <div id="personaAvatars" style="display:flex;gap:6px;width:100%;padding:2px 0;justify-content:center">
    <div class="p-avatar" data-p="mentor" style="background:var(--blue)">M</div>
    <div class="p-avatar" data-p="coach" style="background:var(--green)">C</div>
    <div class="p-avatar" data-p="teacher" style="background:var(--yellow)">T</div>
  </div>
  <div class="mini-metrics" id="miniMetrics"><span id="metricConf">—%</span><span id="metricLeader">—</span><span id="metricStatus">offline</span></div>
  <div class="nav-tabs" id="navTabs">
    <button class="tab-btn active" data-tab="chat">💬 Chat</button>
    <button class="tab-btn" data-tab="story">📖 Story</button>
    <button class="tab-btn" data-tab="drift">📊 Drift</button>
    <button class="tab-btn" data-tab="leaderboard">🏆 Board</button>
    <button class="tab-btn" data-tab="dashboard">📈 Dash</button>
  </div>
  <div id="llmBanner" class="llm-banner mock">Cloud AI offline — using mock replies</div>
  <div style="display:flex;gap:4px;width:100%;margin-top:2px">
    <input id="userIdInput" placeholder="Name..." style="flex:1;padding:3px 6px;border-radius:var(--radius-sm);border:1px solid var(--surface3);background:var(--surface2);color:var(--text);font-size:10px;outline:none;min-width:0">
    <button class="btn" id="setUserBtn" style="background:var(--blue);color:var(--bg);font-size:9px;padding:2px 8px">Set</button>
    <button class="btn" id="syncBtn" style="background:var(--surface3);color:var(--text);font-size:9px;padding:2px 8px">🔄</button>
  </div>
  <div id="userDisplay" style="font-size:9px;color:var(--text3);width:100%">Not set</div>
</div>
<div class="main">
  <div class="tab-content active" id="tab-chat">
    <div class="msgs" id="msgs"></div>
    <div class="input-bar">
      <input id="input" placeholder="Type a message, or try 'set mentor 60 coach 25 teacher 15'..." autofocus>
      <button class="btn" id="sendBtn" style="background:var(--blue);color:var(--bg)">Send</button>
    </div>
  </div>
  <div class="tab-content" id="tab-story">
    <div class="panel-scroll">
      <div style="display:flex;gap:4px;margin-bottom:6px"><button class="btn" id="storyBtnTab" style="background:var(--blue);color:var(--bg);font-size:11px">🔊 Narrate</button><button class="btn" id="orchStoryBtn" style="background:var(--yellow);color:var(--bg);font-size:11px">🎼 Orchestration</button><button class="btn" id="sessionReplayBtn" style="background:var(--green);color:var(--bg);font-size:11px">🔁 Replay</button><button class="btn" id="exportBtn" style="background:var(--surface3);color:var(--text);font-size:11px">💾 Export</button><button class="btn" id="impactNarrBtnTab" style="background:var(--surface3);color:var(--text);font-size:11px">🏅 Impact</button><button class="btn" id="badgeNarrBtn" style="background:var(--surface3);color:var(--text);font-size:11px">🎖️ Badges</button><button class="btn" id="badgeTimelineBtn" style="background:var(--surface3);color:var(--text);font-size:11px">📅 Timeline</button><button class="btn" id="legacyBtn" style="background:var(--surface3);color:var(--text);font-size:11px">📜 Legacy</button><button class="btn" id="legacyNarrBtn" style="background:var(--surface3);color:var(--text);font-size:11px">🗣️ Legacy Narr</button></div>
      <div id="storyPanel" class="stat">Tap "Narrate" for a full story — drift, leaderboard, simulation, and contributor highlights.</div>
      <canvas id="replayCanvas" style="display:none;width:100%;height:100px;border-radius:var(--radius-sm);background:var(--surface2);margin:4px 0"></canvas>
      <div id="badgeTimelinePanel" style="display:none;font-size:9px;color:var(--text2);max-height:120px;overflow-y:auto;margin:4px 0;padding:4px;background:var(--surface2);border-radius:var(--radius-sm)"></div>
      <hr style="border-color:var(--surface3);margin:8px 0">
      <div id="leaderboardPanel" class="stat" style="font-size:9px;min-height:30px">Leaderboard loading...</div>
    </div>
  </div>
  <div class="tab-content" id="tab-drift">
    <div class="panel-scroll">
      <div style="display:flex;gap:4px;margin-bottom:6px"><button class="btn" id="driftBtn" style="background:var(--blue);color:var(--bg);font-size:11px">⟳ Load</button><button class="btn" id="driftNarrBtn" style="background:var(--surface3);color:var(--text);font-size:11px">🔊 Narrate</button><button class="btn" id="animateDriftBtn" style="background:var(--surface3);color:var(--text);font-size:11px">▶️ Animate</button></div>
      <canvas id="driftCanvas" style="display:none;width:100%;height:140px;border-radius:var(--radius-sm);background:var(--surface2)"></canvas>
      <div id="driftLegend" style="font-size:8px;color:var(--text3);display:flex;flex-wrap:wrap;gap:4px;margin:4px 0"></div>
      <div id="driftInfluence" class="stat" style="font-size:9px;max-height:100px;overflow-y:auto">Load drift data</div>
      <hr style="border-color:var(--surface3);margin:8px 0">
      <div style="font-size:10px;color:var(--text2);margin-bottom:4px">Weight Delta Over Time</div>
      <canvas id="weightDeltaCanvas" style="width:100%;height:80px;border-radius:var(--radius-sm);background:var(--surface2)"></canvas>
    </div>
  </div>
  <div class="tab-content" id="tab-leaderboard">
    <div class="panel-scroll">
      <div style="display:flex;gap:4px;margin-bottom:6px"><button class="btn" id="impactNarrBtnLB" style="background:var(--surface3);color:var(--text);font-size:11px">🔊 Impact</button><button class="btn" id="narrateContribBtn" style="background:var(--surface3);color:var(--text);font-size:11px">👥 Contributors</button></div>
      <div id="leaderboardPanelLB" class="stat" style="font-size:9px">Loading...</div>
      <hr style="border-color:var(--surface3);margin:8px 0">
      <div id="contributorList" class="stat" style="font-size:9px">No contributors</div>
    </div>
  </div>
  <div class="tab-content" id="tab-dashboard">
    <div class="panel-scroll">
      <div style="display:flex;gap:4px;margin-bottom:6px"><button class="btn" id="dashRefreshBtn" style="background:var(--blue);color:var(--bg);font-size:11px">⟳</button><button class="btn" id="dashNarrBtn" style="background:var(--surface3);color:var(--text);font-size:11px">🔊 Auto</button></div>
      <div id="dashPanel" class="stat" style="font-size:9px;line-height:1.5">Loading...</div>
      <canvas id="dashCanvas" style="display:none;width:100%;height:60px;margin:6px 0;border-radius:var(--radius-sm);background:var(--surface2)"></canvas>
      <hr style="border-color:var(--surface3);margin:8px 0">
      <div style="display:flex;gap:4px;margin-bottom:4px"><button class="btn" id="driftBtnDash" style="background:var(--blue);color:var(--bg);font-size:10px">📊 Drift</button><button class="btn" id="covBtn" style="background:var(--surface3);color:var(--text);font-size:10px">📈 Coverage</button></div>
      <canvas id="covCanvasDash" style="display:none;width:100%;height:80px;border-radius:var(--radius-sm);background:var(--surface2)"></canvas>
    </div>
  </div>
</div>
<script>
const API='/api';let persona='mentor',weights={},conv=[],listening=0,R=null,alertShown={},dashNarrate=0;
const $=s=>document.querySelector(s),i=$('#input'),m=$('#msgs'),s=$('#sendBtn'),p=$('#persona'),w=$('#weights'),vb=$('#voiceBtn'),uid=$('#userIdInput'),sub=$('#setUserBtn'),ud=$('#userDisplay'),nb=$('#syncBtn');
let userId=localStorage.getItem('youfeel_user')||'';

function headers(){
  const h={'Content-Type':'application/json'};
  if(userId)h['X-User-Id']=userId;
  return h
}
function updateUserDisplay(){
  if(userId){ud.innerHTML='<span style="color:var(--green)">\u25CF</span> '+userId;uid.value=userId}
  else ud.innerHTML='<span style="color:var(--red)">\u25CF</span> Not set'
}
function setUserId(name){
  userId=name;localStorage.setItem('youfeel_user',name);updateUserDisplay();
  addControl('Identity set to '+name);speakText('Hello, '+name)
}
sub.onclick=()=>{const n=uid.value.trim();if(n)setUserId(n)};
uid.onkeydown=e=>{if(e.key==='Enter')sub.click()};
if(userId)updateUserDisplay();

function add(r,t,meta){
  const d=document.createElement('div');d.className='msg '+r;
  d.innerHTML=t.replace(/\n/g,'<br>');
  if(meta){const m2=document.createElement('div');m2.className='meta';m2.textContent=meta;d.appendChild(m2)}
  m.appendChild(d);m.scrollTop=m.scrollHeight
}
function addControl(t){add('control','\u2699\uFE0F '+t)}
function speakText(text,emotion){
  if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(text);
  const prosody={joy:{rate:1.2,pitch:1.3},empathy:{rate:0.85,pitch:0.8},encouragement:{rate:1.1,pitch:1.1},challenge:{rate:0.9,pitch:0.85},reflection:{rate:1.0,pitch:1.0},neutral:{rate:1.1,pitch:1.0}};
  const p=prosody[emotion]||prosody.neutral;
  u.rate=p.rate;u.pitch=p.pitch;
  speechSynthesis.speak(u)
}

function parseWeightText(text){
  const parts=text.toLowerCase().split(/[,;]+/);
  const newW={};let found=0;
  for(const p of parts){
    const m=p.match(/\s*(mentor|coach|teacher)\s*[=:]\s*(\d+)/);
    if(m){newW[m[1]]=Math.min(100,Math.max(0,parseInt(m[2])));found++}
  }
  if(found>=2)return newW;
  const m2=text.toLowerCase().match(/(mentor|coach|teacher)\s+(\d+)/g);
  if(m2&&m2.length>=2){m2.forEach(p=>{const[,n,v]=p.match(/(mentor|coach|teacher)\s+(\d+)/);newW[n]=Math.min(100,Math.max(0,parseInt(v)))});return newW}
  return null
}

async function chat(msg){
  add('user',msg);i.disabled=1;s.disabled=1;
  try{
    const r2=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,persona:persona,weights:weights,conversation:conv})});
    const d=await r2.json();
    add('assistant',d.reply,`${d.emotion?'\u2728 '+d.emotion:''} \u2022 score: ${d.score}${d.intent?' \u2022 '+d.intent:''}${d.escalation_tier?' \u2022 tier '+d.escalation_tier:''}`);
    weights=d.weights||weights;updateW();updateAvatarEvolution();
    if(d.dynamic_boost&&d.dynamic_boost.changed){
      const b=d.dynamic_boost;
      const reasonMap={'consecutive low scores':'after '+d.dynamic_boost.reason.match(/\d+/)?.[0]||'several'+' consecutive low confidence replies','escalation detected':'an escalation was detected','high confidence + explanation intent':'confidence is high with an explanation request','high confidence baseline':'consistently high confidence','default':'normal conditions'};
      const naturalReason=reasonMap[b.reason]||b.reason;
      const msg2=b.persona+' boosted +'+b.boost+' '+naturalReason+'. Source: '+b.source;
      addControl('Boost: '+msg2);speakText('Persona boost. '+msg2,'encouragement');
      pulseAvatar(b.persona)
    }
    if(d.escalation_tier)cue(d.escalation_tier,d.intent)
  }catch(e){add('assistant','Error: '+e.message)}
  i.disabled=0;s.disabled=0;i.focus()
}

function updateW(){
  w.innerHTML='';const names=Object.keys(weights).length?Object.keys(weights):['mentor','coach','teacher'];
  const vals=Object.keys(weights).length?Object.values(weights):[50,0,0];
  const cs={mentor:'#89b4fa',coach:'#a6e3a1',teacher:'#f9e2af'};
  names.forEach((n,j)=>{
    const v=vals[j]||0,c=cs[n]||'#89b4fa';
    const r2=document.createElement('div');r2.style.cssText='display:flex;align-items:center;gap:6px;margin:2px 0';
    r2.innerHTML='<span style="font-size:10px;min-width:44px;color:var(--text2)">'+n+'</span><div class="wbar" style="height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;flex:1"><div style="height:100%;border-radius:2px;transition:width .5s;width:'+v+'%;background:'+c+';animation:barPulse .6s"></div></div><span style="font-size:9px;min-width:22px;color:var(--text2)">'+v+'</span>';
    w.appendChild(r2)
  })
}

function cue(tier,intent){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    const fs=intent==='motivate'?[523,659,784]:intent==='explain'?[440,440,440]:intent==='advise'?[784,659,523]:[400,500,700];
    osc.frequency.setValueAtTime(fs[Math.min(tier-1,fs.length-1)],ctx.currentTime);
    gain.gain.setValueAtTime(0.25,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.2);
    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.2)
  }catch(e){}
}

async function updateAvatarEvolution(){
  try{
    const r=await fetch(API+'/persona-influence');const d=await r.json();
    const inf=d.influence||{},total=d.total||1;
    const personas=['mentor','coach','teacher'],colors=['#89b4fa','#a6e3a1','#f9e2af'];
    personas.forEach((p,pi)=>{
      const el=document.querySelector('.p-avatar[data-p="'+p+'"]');
      if(!el)return;
      const val=inf[p]||0,ratio=Math.min(val/total,1);
      const opacity=.6+ratio*.4;
      const size=22+Math.round(ratio*8);
      const glow=ratio*6;
      el.style.opacity=opacity;
      el.style.width=size+'px';el.style.height=size+'px';
      el.style.fontSize=Math.round(size/2.4)+'px';
      if(glow>1)el.style.boxShadow='0 0 '+glow+'px '+colors[pi];else el.style.boxShadow='none'
    })
  }catch(e){}
}

p.onchange=()=>{persona=p.value};
s.onclick=()=>{
  const t=i.value.trim();
  if(!t)return;i.value='';
  const lower=t.toLowerCase();
  if(lower.startsWith('set ')||lower.startsWith('weights ')||lower.startsWith('weight ')){
    const parsed=parseWeightText(t);
    if(parsed){weights=parsed;updateW();addControl('Weights set: '+JSON.stringify(weights));speakText('Weights updated');return}
  }
  chat(t)
};
i.onkeydown=e=>{if(e.key==='Enter')s.click()};

nb.onclick=async()=>{
  if(!userId){
    const n=prompt('Enter your name for sync identity:');
    if(n){setUserId(n.trim())}else{addControl('Set your identity first');return}
  }
  try{
    const r2=await fetch(API+'/sync',{method:'POST',headers:headers()});const d=await r2.json();
    const dc=d.dataset_changes||{};
    const nar='Sync for '+d.user_id+': sync number '+d.sync_count+', '+d.total_scores+' responses, '+d.weak_count+' weak, average confidence '+d.avg_confidence+'.';
    speakText(nar,'encouragement');
    const balMsg=(d.balance_applied?' \u2699 balance adjusted':'')+(d.rollback_applied?' \u21BA rollback: '+d.rollback_reason:'');
    addControl('Sync #'+d.sync_count+': '+d.total_scores+' resp, avg '+d.avg_confidence+(dc.fewshot_entries_added?' +'+dc.fewshot_entries_added+' fewshot':'')+(dc.conflicts_resolved?' x'+dc.conflicts_resolved+' conflict':'')+(dc.gold_exports?' x'+dc.gold_exports+' gold':'')+balMsg);
    await refreshMetrics();updateMiniMetrics()
  }catch(e){addControl('Sync failed')}
};

const DRIFT_COLORS={sync:'#89b4fa',conflict_resolve:'#f38ba8',weak_reply:'#f9e2af',gold_export:'#f5c2e7',simulate:'#a6e3a1',federated_simulate:'#cba6f7'};
const DRIFT_LABELS={sync:'Sync',conflict_resolve:'Conflict',weak_reply:'Weak',gold_export:'Gold',simulate:'Sim',fed_sim:'Fed Sim'};

async function loadDrift(){
  const canvas=$('#driftCanvas'),legend=$('#driftLegend'),inf=$('#driftInfluence');
  canvas.style.display='none';legend.innerHTML='';inf.innerHTML='Loading...';
  drawWeightDelta($('#weightDeltaCanvas'));
  try{
    const r=await fetch(API+'/persona-drift');const d=await r.json();
    if(!d.timeline.length){inf.innerHTML='No drift data yet. Sync, chat, or simulate to generate events.';return}
    drawDriftChart(canvas,d);

      }).join('<br>')
    }else{inf.innerHTML='No contributor influence data yet.'}
  }catch(e){inf.innerHTML='Error: '+e.message}
}

function drawDriftChart(canvas,d){
  const ctx=canvas.getContext('2d');
  const W=canvas.parentElement.clientWidth-4||260,H=140;
  canvas.width=W*2;canvas.height=H*2;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  canvas.style.display='block';
  ctx.scale(2,2);
  const pad={t:14,b:20,l:28,r:8};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  const simTrend=d.sim_avg_trend||[];
  const events=d.timeline.filter(e=>e.action!=='simulate'&&e.action!=='federated_simulate');
  const maxCount=Math.max(events.length,simTrend.length,5);
  ctx.strokeStyle='#45475a';ctx.lineWidth=0.5;ctx.font='7px sans-serif';
  for(let i=0;i<=4;i++){
    const y=pad.t+ch-(i/4*ch),v=Math.round(100-i*25);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.strokeStyle='#45475a';ctx.stroke();
    ctx.fillStyle='var(--text3)';ctx.textAlign='right';ctx.fillText(v+'%',pad.l-3,y+2)
  }
  if(simTrend.length>1){
    ctx.beginPath();ctx.strokeStyle='rgba(205,214,244,0.5)';ctx.lineWidth=1;
    simTrend.forEach((pt,i)=>{
      const x=pad.l+(i/(simTrend.length-1||1))*cw;
      const y=pad.t+ch-((pt.value||50)/100*ch);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)
    });ctx.stroke();
    simTrend.forEach((pt,i)=>{
      const x=pad.l+(i/(simTrend.length-1||1))*cw;
      const y=pad.t+ch-((pt.value||50)/100*ch);
      ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);
      ctx.fillStyle='rgba(205,214,244,0.6)';ctx.fill()
    })
  }
  if(events.length){
    events.forEach((ev,i)=>{
      const x=pad.l+(i/(Math.max(events.length-1,1)||1))*cw;
      const y=ev.sim_avg!==null&&ev.sim_avg!==undefined?pad.t+ch-((ev.sim_avg||50)/100*ch):pad.t+ch-10;
      const clr=DRIFT_COLORS[ev.action]||'var(--text3)';
      ctx.fillStyle=clr;
      if(ev.action==='conflict_resolve'){
        ctx.beginPath();ctx.moveTo(x,y-4);ctx.lineTo(x+3,y);ctx.lineTo(x,y+4);ctx.lineTo(x-3,y);ctx.closePath();ctx.fill()
      }else if(ev.action==='weak_reply'){
        ctx.beginPath();ctx.moveTo(x,y-4);ctx.lineTo(x+3,y+2);ctx.lineTo(x-3,y+2);ctx.closePath();ctx.fill()
      }else if(ev.action==='gold_export'){
        ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()
      }else{
        ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()
      }
    })
  }
  ctx.fillStyle='var(--text3)';ctx.textAlign='center';ctx.font='7px sans-serif';
  if(simTrend.length>1)ctx.fillText('Time \u2192',pad.l+cw/2,pad.t+ch+16)
}

function drawWeightDelta(canvas){
  try{
    fetch(API+'/weight-history').then(r=>r.json()).then(d=>{
      const h=d.history||[];
      const scores=d.score_history||[];
      if(h.length<2){canvas.style.display='none';return}
      canvas.style.display='block';
      const ctx=canvas.getContext('2d');
      const W=canvas.parentElement.clientWidth-4||220,H=80;
      canvas.width=W*2;canvas.height=H*2;canvas.style.width=W+'px';canvas.style.height=H+'px';
      ctx.scale(2,2);
      const pad={t:8,b:14,l:22,r:8},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
      ctx.clearRect(0,0,W,H);
      const personas=['mentor','coach','teacher'];
      const colors=['#89b4fa','#a6e3a1','#f9e2af'];
      const maxV=100;
      ctx.strokeStyle='#45475a';ctx.lineWidth=0.5;ctx.font='6px sans-serif';
      for(let i=0;i<=4;i++){
        const y=pad.t+ch-(i/4*ch),v=Math.round(i/4*maxV);
        ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.strokeStyle='#45475a';ctx.stroke();
        ctx.fillStyle='var(--text3)';ctx.textAlign='right';ctx.fillText(v,pad.l-2,y+2)
      }
      personas.forEach((p,pi)=>{
        ctx.beginPath();ctx.strokeStyle=colors[pi];ctx.lineWidth=1.2;
        h.forEach((pt,i)=>{
          const w=pt.weights[p]||0;
          const x=pad.l+(i/(h.length-1))*cw;
          const y=pad.t+ch-(w/maxV*ch);
          i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)
        });ctx.stroke()
      });
      if(scores.length>=2){
        ctx.beginPath();ctx.strokeStyle='rgba(243,139,168,0.6)';ctx.lineWidth=.8;ctx.setLineDash([2,2]);
        scores.forEach((s,i)=>{
          const x=pad.l+(i/(scores.length-1))*cw;
          const y2=pad.t+ch-(s/maxV*ch);
          i===0?ctx.moveTo(x,y2):ctx.lineTo(x,y2)
        });ctx.stroke();ctx.setLineDash([])
      }
      ctx.fillStyle='var(--text3)';ctx.textAlign='center';ctx.font='6px sans-serif';
      ctx.fillText('weights + confidence',pad.l+cw/2,pad.t+ch+12);
      personas.forEach((p,pi)=>{
        ctx.fillStyle=colors[pi];
        ctx.fillRect(pad.l+pi*44,pad.t-6,6,4);
        ctx.fillStyle='var(--text3)';ctx.textAlign='left';ctx.fillText(p,pad.l+pi*44+8,pad.t-2)
      });
      if(scores.length>=2){
        ctx.fillStyle='rgba(243,139,168,0.6)';ctx.fillRect(pad.l+132,pad.t-6,6,4);
        ctx.fillStyle='var(--text3)';ctx.fillText('confidence',pad.l+140,pad.t-2)
      }
    })
  }catch(e){canvas.style.display='none'}
}

    ctx.fillStyle='#f9e2af';ctx.fillRect(pad.l+80,pad.t+ch+2,6,3);ctx.fillStyle='var(--text3)';ctx.fillText('teacher',pad.l+88,pad.t+ch+5);
    ctx.fillStyle='rgba(243,139,168,0.6)';ctx.fillRect(pad.l+130,pad.t+ch+2,6,3);ctx.fillStyle='var(--text3)';ctx.fillText('confidence',pad.l+138,pad.t+ch+5)
  }catch(e){canvas.style.display='none'}
}

function pulseAvatar(persona){
  const el=document.querySelector('.p-avatar[data-p="'+persona+'"]');
  if(el){el.classList.remove('boosted');void el.offsetWidth;el.classList.add('boosted')}
}

function drawContributorChart(canvas,u){
  try{
    const dt=u.drift_timeline||[],bt=u.badge_timeline||[];
    if(!dt.length&&!bt.length){canvas.style.display='none';return}
    canvas.style.display='block';
    const ctx=canvas.getContext('2d');
    const W=canvas.parentElement.clientWidth-4||200,H=36;
    canvas.width=W*2;canvas.height=H*2;canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.scale(2,2);
    const pad={t:4,b:6,l:4,r:4},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
    ctx.clearRect(0,0,W,H);
    const personas=['mentor','coach','teacher'],colors=['#89b4fa','#a6e3a1','#f9e2af'];
    if(dt.length>=2){
      personas.forEach((p,pi)=>{
        ctx.beginPath();ctx.strokeStyle=colors[pi];ctx.lineWidth=.8;
        dt.forEach((pt,i)=>{
          const w=pt.weights&&pt.weights[p]||0;
          const x=pad.l+(i/(dt.length-1))*cw;
          const y=pad.t+ch-(w/100*ch);
          i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)
        });ctx.stroke()
      })
    }
    bt.forEach(b=>{
      const idx=dt.length?Math.round((dt.length-1)*0.8):0;
      const x=pad.l+(idx/(Math.max(dt.length,1)))*cw;
      ctx.fillStyle='var(--yellow)';ctx.font='6px sans-serif';ctx.textAlign='center';
      ctx.fillText('\u2B50',x,pad.t+ch+4)
    });
    ctx.fillStyle='var(--text3)';ctx.font='5px sans-serif';ctx.textAlign='left';
    ctx.fillText('drift + badges',pad.l,pad.t+3)
  }catch(e){canvas.style.display='none'}
}

let animDriftInterval=null;
function animateDriftLines(canvas,data,stepCb){
  if(animDriftInterval){clearInterval(animDriftInterval);animDriftInterval=null}
  const h=data.history||[],scores=data.score_history||[];
  if(h.length<2)return;
  const W=canvas.parentElement.clientWidth-4||220,H=140;
  canvas.width=W*2;canvas.height=H*2;canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');ctx.scale(2,2);
  const pad={t:8,b:18,l:24,r:8},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const personas=['mentor','coach','teacher'],colors=['#89b4fa','#a6e3a1','#f9e2af'],maxV=100;
  let step=2;
  animDriftInterval=setInterval(()=>{
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#45475a';ctx.lineWidth=0.5;ctx.font='6px sans-serif';
    for(let i=0;i<=4;i++){
      const y2=pad.t+ch-(i/4*ch),v=Math.round(i/4*maxV);
      ctx.beginPath();ctx.moveTo(pad.l,y2);ctx.lineTo(W-pad.r,y2);ctx.strokeStyle='#45475a';ctx.stroke();
      ctx.fillStyle='var(--text3)';ctx.textAlign='right';ctx.fillText(v,pad.l-2,y2+2)
    }
    const visible=h.slice(0,step);
    personas.forEach((p,pi)=>{
      ctx.beginPath();ctx.strokeStyle=colors[pi];ctx.lineWidth=1.2;
      visible.forEach((pt,i)=>{
        const w=pt.weights[p]||0;
        const x=pad.l+(i/(h.length-1))*cw;
        const y3=pad.t+ch-(w/maxV*ch);
        i===0?ctx.moveTo(x,y3):ctx.lineTo(x,y3)
      });ctx.stroke()
    });
    if(scores.length>=2){
      ctx.beginPath();ctx.strokeStyle='rgba(243,139,168,0.6)';ctx.lineWidth=.8;ctx.setLineDash([2,2]);
      const sv=scores.slice(0,Math.min(step,scores.length));
      sv.forEach((s,i)=>{
        const x=pad.l+(i/(scores.length-1))*cw;
        const y4=pad.t+ch-(s/maxV*ch);
        i===0?ctx.moveTo(x,y4):ctx.lineTo(x,y4)
      });ctx.stroke();ctx.setLineDash([])
    }
    ctx.fillStyle='var(--text3)';ctx.textAlign='center';ctx.font='6px sans-serif';
    ctx.fillText('step '+step+'/'+h.length,pad.l+cw/2,pad.t+ch+14);
    personas.forEach((p,pi)=>{
      ctx.fillStyle=colors[pi];ctx.fillRect(pad.l+pi*44,pad.t-6,6,4);
      ctx.fillStyle='var(--text3)';ctx.textAlign='left';ctx.fillText(p,pad.l+pi*44+8,pad.t-2)
    });
    if(stepCb&&visible.length)stepCb(visible[visible.length-1],step);
    step++;
    if(step>h.length){clearInterval(animDriftInterval);animDriftInterval=null}
  },400)
}
$('#animateDriftBtn').onclick=async()=>{
  try{
    const canvas=$('#driftCanvas');canvas.style.display='block';
    const r=await fetch(API+'/weight-history');const d=await r.json();

    animateDriftLines(canvas,d,(last,stp)=>{
      if(last&&last.boost&&last.boost.changed)pulseAvatar(last.boost.persona||'coach')
    })
  }catch(e){}
};

function switchTab(tabId){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  const tab=document.getElementById('tab-'+tabId);
  if(tab)tab.classList.add('active');
  const btn=document.querySelector('[data-tab="'+tabId+'"]');
  if(btn)btn.classList.add('active');
  if(tabId==='dashboard')refreshDashboard();
  if(tabId==='drift')loadDrift();
  if(tabId==='leaderboard')refreshLeaderboard('#leaderboardPanelLB');
  if(tabId==='story'){refreshLeaderboard('#leaderboardPanel');$('#storyPanel').innerHTML='Tap "Narrate" for a full story.'}
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=()=>switchTab(btn.dataset.tab)
});

vb.onclick=()=>{
  if(listening){R&&R.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addControl('Voice not supported');return}
  R=new SR();R.lang='en-US';R.interimResults=0;R.continuous=0;
  R.onstart=()=>{listening=1;vb.textContent='\u23F9';vb.style.background='var(--red)'};
  R.onend=()=>{listening=0;vb.textContent='\uD83C\uDFA4';vb.style.background='var(--surface3)'};
  R.onresult=e=>{
    const t=e.results[0][0].transcript;
    const parsed=parseWeightText(t);
    if(parsed){weights=parsed;updateW();speakText('Weights updated');addControl('Voice weights: '+JSON.stringify(weights))}
    else{chat(t)}
  };
  R.onerror=e=>{listening=0;vb.textContent='\uD83C\uDFA4';vb.style.background='var(--surface3)'};
  R.start()
};
